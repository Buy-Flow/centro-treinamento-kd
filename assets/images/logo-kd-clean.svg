<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Centro de Treinamento KD</title>
  <desc id="desc">Logo KD limpa com halter, sem ruído ou artefatos</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#dedede"/>
    </radialGradient>
  </defs>
  <circle cx="300" cy="300" r="286" fill="url(#bg)"/>

  <!-- barra do halter -->
  <rect x="105" y="286" width="390" height="14" rx="7" fill="#181818"/>

  <!-- pesos esquerdo -->
  <g fill="#0a0a0a">
    <rect x="128" y="246" width="20" height="94" rx="7"/>
    <rect x="151" y="230" width="25" height="126" rx="8"/>
    <rect x="180" y="252" width="18" height="82" rx="7"/>
  </g>

  <!-- pesos direito -->
  <g fill="#0a0a0a">
    <rect x="452" y="246" width="20" height="94" rx="7"/>
    <rect x="424" y="230" width="25" height="126" rx="8"/>
    <rect x="402" y="252" width="18" height="82" rx="7"/>
  </g>

  <!-- D cinza ao fundo -->
  <path d="M287 198h66c63 0 108 40 108 103s-45 103-108 103h-66zm58 52v102h14c29 0 49-19 49-51s-20-51-49-51z" fill="#8f8f8f"/>

  <!-- K preto principal -->
  <path d="M224 198h63v78l67-78h78l-82 91 88 115h-80l-71-94v94h-63z" fill="#050505"/>

  <text x="300" y="452" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="8">CENTRO DE</text>
  <text x="300" y="485" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="7">TREINAMENTO</text>
</svg>